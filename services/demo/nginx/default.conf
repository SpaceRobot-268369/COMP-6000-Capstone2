# Demo reverse proxy: one public port, everything same-origin.
#
# The browser only ever talks to :80 here, so the frontend calls /api with no
# absolute base (VITE_API_URL="") and the backend's CORS allowlist matters only
# for the single public origin.
#
# HTTP only. The demo is meant to be portable to whatever host is handy, and
# baking a cert path into the image would break every host that lacks it. To
# put this behind HTTPS, terminate TLS in front of it (a host-level nginx,
# Caddy, or a load balancer) and keep this container as the upstream.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Analysis mode uploads a recording.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        # The mock's slowest reply is its fake think-time (a few seconds), not
        # real inference — so these are far tighter than the Server A config,
        # which has to wait on diffusion runs.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        # Vite 5.4+ 403s hosts outside server.allowedHosts (DNS-rebinding
        # guard), and this stack has no idea what hostname it will be deployed
        # under. `localhost` is always allowed, so present that upstream; the
        # browser still sees its own origin.
        proxy_set_header Host localhost;
        # Carries the Vite HMR websocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
