services:
  ai-tunnel:
    container_name: ${AI_TUNNEL_CONTAINER_NAME:-eco-ai-tunnel-server-a}
    image: ${AI_TUNNEL_IMAGE:-ghcr.io/spacerobot-268369/eco-ai-tunnel:${IMAGE_TAG:-main}}
    environment:
      AI_SERVER_LABEL: ${AI_SERVER_LABEL:-shinypokemon}
      AI_SSH_USER: ${AI_SSH_USER:-ubuntu}
      AI_SSH_HOST: ${AI_SSH_HOST:-shinypokemon.adelaideuni.cloud}
      AI_SSH_KEY_PATH: /run/secrets/shinypokemon.pem
      AI_TUNNEL_BIND_HOST: 0.0.0.0
      AI_TUNNEL_LOCAL_PORT: ${AI_TUNNEL_LOCAL_PORT:-8000}
      AI_TUNNEL_REMOTE_HOST: ${AI_TUNNEL_REMOTE_HOST:-127.0.0.1}
      AI_TUNNEL_REMOTE_PORT: ${AI_TUNNEL_REMOTE_PORT:-8000}
      AI_SERVICE_START_COMMAND: ${AI_SERVICE_START_COMMAND:-}
      AI_SERVICE_START_TIMEOUT_SEC: ${AI_SERVICE_START_TIMEOUT_SEC:-60}
      AI_SERVICE_START_POLL_SEC: ${AI_SERVICE_START_POLL_SEC:-3}
    secrets:
      - source: shinypokemon_pem
        target: shinypokemon.pem
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${AI_TUNNEL_LOCAL_PORT:-8000}/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app_net

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/spacerobot-268369/eco-backend:${IMAGE_TAG:-main}}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: ${BACKEND_PORT:-4000}
      AI_CONNECTION_MODE: ssh_tunnel
      AI_SERVER_URL: http://ai-tunnel:8000
      AI_SERVER_LABEL: ${AI_SERVER_LABEL:-shinypokemon}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-300000}
      AI_TUNNEL_LOCAL_PORT: ${AI_TUNNEL_LOCAL_PORT:-8000}
      AI_TUNNEL_REMOTE_HOST: ${AI_TUNNEL_REMOTE_HOST:-127.0.0.1}
      AI_TUNNEL_REMOTE_PORT: ${AI_TUNNEL_REMOTE_PORT:-8000}
      AI_RECONNECT_MODE: docker-container
      AI_RECONNECT_CONTAINER: ${AI_TUNNEL_CONTAINER_NAME:-eco-ai-tunnel-server-a}
    ports:
      - "${BACKEND_PORT:-4000}:${BACKEND_PORT:-4000}"
    depends_on:
      postgres:
        condition: service_healthy
      ai-tunnel:
        condition: service_started
    volumes:
      # Allows the backend reconnect endpoint to restart only the configured
      # ai-tunnel container through Docker's API.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app_net

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/spacerobot-268369/eco-frontend:${IMAGE_TAG:-main}}
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:${BACKEND_PORT:-4000}}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  postgres_data:

secrets:
  shinypokemon_pem:
    file: ${SERVERB_PEM_PATH:-/home/ubuntu/.ssh/itds-eap/shinypokemon.pem}
