map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Shared proxy locations for both the :80 and :443 server blocks.
# (Duplicated inline below rather than via include to keep this a single
# self-contained mounted file.)

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # Backend API (Express) — same-origin so the browser only needs the one port.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        # AI generation (diffusion inference on Server B) runs ~30s+ and can be
        # longer on a cold model load. Keep these above the backend's
        # AI_REQUEST_TIMEOUT_MS so the backend's own error surfaces first
        # instead of an nginx 504.
        proxy_connect_timeout 10s;
        proxy_send_timeout 200s;
        proxy_read_timeout 200s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Vite dev server on 5173). Upgrade headers carry Vite HMR websocket.
    # Vite 5.4+ enforces a Host allowlist (DNS-rebinding guard) and 403s unknown
    # hosts, so present "localhost" (always allowed) to the dev server. The
    # browser still sees its own origin; the app calls the API same-origin (/api).
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS for the public hostname. Browsers default to HTTPS-First when a user
# types the bare hostname, so without this the domain hits a dead :443 and
# fails for anyone who didn't explicitly type http://. The bare IP has no cert
# and stays on :80 above (no forced http->https redirect, so the IP path keeps
# working). Cert is issued by Let's Encrypt (certbot) into /etc/letsencrypt,
# mounted read-only from the host by the compose override.
server {
    listen 443 ssl;
    server_name spacerobot-268369.adelaideuni.cloud;

    ssl_certificate     /etc/letsencrypt/live/spacerobot-268369.adelaideuni.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spacerobot-268369.adelaideuni.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 200s;
        proxy_read_timeout 200s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
