# DEMO stack — AI services excluded.
#
# This branch (`demo`) runs the project for a quick walkthrough without any
# AI worker: no ai-tunnel sidecar, no SSH key/secret, no serverB dependency.
# Only postgres + backend + frontend come up. The backend still exposes its
# AI proxy routes, but they point at an optional host-local FastAPI server
# (AI_SERVER_URL) and simply fail fast if nothing is listening there.
services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./postgresql/data:/var/lib/postgresql/data
      - ./db_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: ${BACKEND_PORT}
      # No tunnel in the demo stack: talk directly to whatever (if anything)
      # is serving the AI API on the host. Override AI_SERVER_URL in .env to
      # attach a locally running FastAPI server.
      AI_CONNECTION_MODE: direct
      AI_SERVER_URL: ${AI_SERVER_URL:-http://host.docker.internal:8000}
      AI_SERVER_LABEL: ${AI_SERVER_LABEL:-local}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-540000}
      LAYER_B_GENERATE_SERVER_URL: ${LAYER_B_GENERATE_SERVER_URL:-}
      LAYER_B_GENERATE_ATTEMPTS: ${LAYER_B_GENERATE_ATTEMPTS:-murphy__mvp_1__wind_intensity_bank,murphy__mvp_1__rain_intensity_seed_pool}
      # Cached expected/showcase samples are served straight from the repo
      # checkout (no AI-worker round-trip). Mount point matches the volume below.
      AI_LAYERS_ROOT: /acoustic_ai/layers
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../backend:/app
      - backend_node_modules:/app/node_modules
      # Read-only mount of the attempts tree so Express can serve cached
      # expected/showcase artefacts (PNG/JSON/WAV) without any AI worker.
      - ../../acoustic_ai:/acoustic_ai:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_net

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT}
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - backend
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  backend_node_modules:
  frontend_node_modules:
