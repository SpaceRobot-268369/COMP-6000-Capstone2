services:
  ai-tunnel:
    container_name: ${AI_TUNNEL_CONTAINER_NAME:-eco-ai-tunnel-dev}
    build:
      context: ./ai-tunnel
      dockerfile: Dockerfile
    environment:
      AI_SERVER_LABEL: ${AI_SERVER_LABEL:-shinypokemon}
      AI_SSH_USER: ${AI_SSH_USER:-ubuntu}
      AI_SSH_HOST: ${AI_SSH_HOST:-shinypokemon.adelaideuni.cloud}
      AI_SSH_KEY_PATH: /run/secrets/shinypokemon.pem
      AI_TUNNEL_BIND_HOST: 0.0.0.0
      AI_TUNNEL_LOCAL_PORT: ${AI_TUNNEL_LOCAL_PORT:-8000}
      AI_TUNNEL_REMOTE_HOST: ${AI_TUNNEL_REMOTE_HOST:-127.0.0.1}
      AI_TUNNEL_REMOTE_PORT: ${AI_TUNNEL_REMOTE_PORT:-8000}
      AI_SERVICE_START_COMMAND: ${AI_SERVICE_START_COMMAND:-}
      AI_SERVICE_START_TIMEOUT_SEC: ${AI_SERVICE_START_TIMEOUT_SEC:-60}
      AI_SERVICE_START_POLL_SEC: ${AI_SERVICE_START_POLL_SEC:-3}
    secrets:
      - source: shinypokemon_pem
        target: shinypokemon.pem
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${AI_TUNNEL_LOCAL_PORT:-8000}/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app_net

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./postgresql/data:/var/lib/postgresql/data
      - ./db_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: ${BACKEND_PORT}
      AI_CONNECTION_MODE: ssh_tunnel
      AI_SERVER_URL: http://ai-tunnel:8000
      AI_SERVER_LABEL: ${AI_SERVER_LABEL:-shinypokemon}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-540000}
      LAYER_B_GENERATE_SERVER_URL: ${LAYER_B_GENERATE_SERVER_URL:-}
      LAYER_B_GENERATE_ATTEMPTS: ${LAYER_B_GENERATE_ATTEMPTS:-murphy__mvp_1__wind_intensity_bank,murphy__mvp_1__rain_intensity_seed_pool}
      AI_TUNNEL_LOCAL_PORT: ${AI_TUNNEL_LOCAL_PORT:-8000}
      AI_TUNNEL_REMOTE_HOST: ${AI_TUNNEL_REMOTE_HOST:-127.0.0.1}
      AI_TUNNEL_REMOTE_PORT: ${AI_TUNNEL_REMOTE_PORT:-8000}
      AI_RECONNECT_MODE: docker-container
      AI_RECONNECT_CONTAINER: ${AI_TUNNEL_CONTAINER_NAME:-eco-ai-tunnel-dev}
      # Cached expected/showcase samples are served straight from the repo
      # checkout (no AI-worker round-trip). Mount point matches the volume below.
      AI_LAYERS_ROOT: /acoustic_ai/layers
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      ai-tunnel:
        condition: service_healthy
    volumes:
      - ../../backend:/app
      - backend_node_modules:/app/node_modules
      # Read-only mount of the attempts tree so Express can serve cached
      # expected/showcase artefacts (PNG/JSON/WAV) without waking serverB.
      - ../../acoustic_ai:/acoustic_ai:ro
      # Allows the backend reconnect endpoint to restart only the configured
      # ai-tunnel container through Docker's API.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app_net

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT}
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - backend
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - app_net

  # acoustic_ai and acoustic_ai_server are intentionally removed.
  # The AI server runs on serverB, outside this Compose stack, and is reached
  # through the ai-tunnel sidecar service.

networks:
  app_net:
    driver: bridge

volumes:
  backend_node_modules:
  frontend_node_modules:

secrets:
  shinypokemon_pem:
    file: ${HOME}/.ssh/itds-eap/shinypokemon.pem
