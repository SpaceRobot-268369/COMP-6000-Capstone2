# DEMO stack — no real AI service.
#
# This branch (`demo`) runs the project for a quick walkthrough without serverB:
# no ai-tunnel sidecar, no SSH key/secret, no GPU. In its place, `ai-mock` speaks
# the same HTTP contract and replays pre-baked fixtures, so backend and frontend
# code are untouched. Nothing here is model output — see ai-mock/README.md.
services:
  ai-mock:
    container_name: ${AI_MOCK_CONTAINER_NAME:-eco-ai-mock-dev}
    build:
      context: ./ai-mock
      dockerfile: Dockerfile
    environment:
      MOCK_FIXTURES_ROOT: /fixtures
      MOCK_REGISTRY_PATH: /registry.yaml
      # Fake think-time, so the frontend's staged progress text has something to
      # narrate instead of flashing past in a single frame.
      MOCK_LATENCY_MS_PARSE: ${MOCK_LATENCY_MS_PARSE:-800}
      MOCK_LATENCY_MS_GENERATE: ${MOCK_LATENCY_MS_GENERATE:-3000}
      MOCK_LATENCY_MS_ANALYSIS: ${MOCK_LATENCY_MS_ANALYSIS:-1500}
      MOCK_LATENCY_MS_NARRATIVE: ${MOCK_LATENCY_MS_NARRATIVE:-400}
    volumes:
      - ./ai-mock/fixtures:/fixtures:ro
      # The registry is git-tracked, so /layers stays in step with the real
      # attempt list even though none of the checkpoints exist here.
      - ../../acoustic_ai/registry.yaml:/registry.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app_net

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./postgresql/data:/var/lib/postgresql/data
      - ./db_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: ${BACKEND_PORT}
      # Hardcoded (not ${...}) on purpose: an inherited AI_SERVER_URL from a
      # pre-demo .env would point the backend at a tunnel that no longer exists.
      AI_CONNECTION_MODE: direct
      AI_SERVER_URL: http://ai-mock:8000
      AI_SERVER_LABEL: ai-mock
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-540000}
      # The mock serves every layer, including the Layer B wind generators, so
      # there is no second server to split traffic to.
      LAYER_B_GENERATE_SERVER_URL: ""
      # Cached expected/showcase samples are served straight from the vendored
      # fixture tree, so a fresh clone needs no `dvc pull` for the demo. The
      # path must end in `layers` — backend/src/samples.js appends `/layers` to
      # any root whose basename isn't already that.
      AI_LAYERS_ROOT: /mock/layers
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      ai-mock:
        condition: service_healthy
    volumes:
      - ../../backend:/app
      - backend_node_modules:/app/node_modules
      - ./ai-mock/fixtures/layers:/mock/layers:ro
    networks:
      - app_net

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT}
      # Vite's /api dev proxy runs inside this container, so it cannot use
      # localhost to reach the backend. Only the relative sample-audio URLs go
      # through it; everything else is an absolute VITE_API_URL call.
      VITE_PROXY_TARGET: http://backend:${BACKEND_PORT}
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - backend
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  backend_node_modules:
  frontend_node_modules:
