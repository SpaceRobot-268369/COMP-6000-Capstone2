smoke_test:
  script: acoustic_ai/tests/layer_b_segment_selection_smoke.py
  target_duration: 30.0
  top_assets: 3
  segments_per_type: 1
  window_seconds: 10.0
  overlap_seconds: 2.0
  cases:
    - name: breeze
      query: light breeze through forest leaves
      weather_types:
        - wind
      wind_speed_ms: 3.0
      precipitation_mm: 0.0
    - name: storm
      query: strong storm wind with distant thunder
      weather_types:
        - wind
        - thunder
      wind_speed_ms: 11.0
      precipitation_mm: 6.0
      include_thunder: true
    - name: light_raining
      query: light raining under forest canopy
      weather_types:
        - rain
      wind_speed_ms: 1.0
      precipitation_mm: 1.0
    - name: heavy_raining
      query: heavy raining in dense forest
      weather_types:
        - rain
      wind_speed_ms: 4.0
      precipitation_mm: 8.0
