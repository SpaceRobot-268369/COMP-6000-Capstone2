ambient:
  latent_dim: 256
  embed_dim: 512
  beta_kl: 0.01
  n_mels: 128
  sample_rate: 22050
  n_fft: 1024
  hop_length: 512
  fmin: 50
  fmax: 11000
  crop_seconds: 30.0
  top_k_retrieval: 10
  noise_std: 0.3
  epochs: 30
  batch_size: 16
  lr: 0.0001

vocoder:
  base_channels: 128
  upsample_rates: [8, 8, 4, 2]
  n_mels: 128
  sample_rate: 22050
  epochs: 100
  max_clips: 500
  batch_size: 8
  lr: 0.0002

# Per-attempt hyperparameters live with the attempt, e.g.
#   acoustic_ai/layers/<layer>/attempts/<member>__<stage>__<slug>/params.yaml
# Frozen training-time snapshots live with the checkpoint at
#   model/candidates/<member>/<stage>__<slug>/params.yaml
# Only stages declared in dvc.yaml read from root params.yaml.
# See CLAUDE.md "Pipeline vs. attempt hyperparameters" and
# .claude/context/dev/attempt_naming.md.
