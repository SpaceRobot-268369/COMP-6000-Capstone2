ambient:
  latent_dim: 256
  embed_dim: 512
  beta_kl: 0.01
  n_mels: 128
  sample_rate: 22050
  n_fft: 1024
  hop_length: 512
  fmin: 50
  fmax: 11000
  crop_seconds: 30.0
  top_k_retrieval: 10
  noise_std: 0.3
  epochs: 30
  batch_size: 16
  lr: 0.0001

vocoder:
  base_channels: 128
  upsample_rates: [8, 8, 4, 2]
  n_mels: 128
  sample_rate: 22050
  epochs: 100
  max_clips: 500
  batch_size: 8
  lr: 0.0002

# CLAP-conditioned latent diffusion (Method X smoke test)
# Conditioning: 512-dim CLAP text embedding (laion/clap-htsat-unfused)
# Dataset: 50 spring/night/September clips from smoking_test_dataset/
diffusion_clap:
  latent_dim: 256
  cond_dim: 512            # CLAP text embedding dim
  hidden_dim: 512
  num_blocks: 6
  num_train_timesteps: 1000
  schedule: cosine
  prediction: v
  num_inference_steps: 50
  epochs: 500              # intentional overfit on 50 clips for smoke test
  batch_size: 16
  lr: 0.0002
  weight_decay: 0.0001
  ema_decay: 0.999
  cond_dropout_p: 0.1
  cfg_scale: 3.0           # higher than env-cond model; text guidance is stronger
