# DVC pipeline.
#
# All stages currently belong to the Layer A smoke_4 VAE-baseline attempt.
# When new attempts add reproducible pipelines, add them here, scoped to
# their own attempt path:
#   acoustic_ai/layers/<layer>/attempts/<id>/...
#
# Per-stage params live in root params.yaml (only stages declared here may
# read from root params.yaml — see CLAUDE.md → "Pipeline vs. attempt
# hyperparameters").

stages:

  precompute_spectrograms:
    cmd: python3 acoustic_ai/layers/layer_a/attempts/lucas__smoke_4__vae_baseline/precompute/precompute_spectrograms.py
    deps:
      - acoustic_ai/layers/layer_a/attempts/lucas__smoke_4__vae_baseline/precompute/precompute_spectrograms.py
      - acoustic_ai/layers/layer_a/attempts/lucas__smoke_4__vae_baseline/code/preprocess.py
      - resources/site_257_bowra-dry-a/site_257_training_manifest.csv
    outs:
      - acoustic_ai/layers/layer_a/attempts/lucas__smoke_4__vae_baseline/data/shared/wavs:
          cache: true
      - acoustic_ai/layers/layer_a/attempts/lucas__smoke_4__vae_baseline/data/shared/spectrograms:
          cache: true

  train_vae:
    cmd: python3 acoustic_ai/layers/layer_a/attempts/lucas__smoke_4__vae_baseline/code/train.py
    deps:
      - acoustic_ai/layers/layer_a/attempts/lucas__smoke_4__vae_baseline/code/train.py
      - acoustic_ai/layers/layer_a/attempts/lucas__smoke_4__vae_baseline/code/model.py
      - acoustic_ai/layers/layer_a/attempts/lucas__smoke_4__vae_baseline/code/dataset.py
      - acoustic_ai/layers/layer_a/attempts/lucas__smoke_4__vae_baseline/code/preprocess.py
      - resources/site_257_bowra-dry-a/site_257_training_manifest.csv
    params:
      - params.yaml:
          - ambient.latent_dim
          - ambient.embed_dim
          - ambient.beta_kl
          - ambient.n_mels
          - ambient.crop_seconds
          - ambient.epochs
          - ambient.batch_size
          - ambient.lr
    outs:
      - model/candidates/lucas/vae-site257-30epoch/best.pt:
          cache: true

  precompute_latents:
    cmd: python3 acoustic_ai/layers/layer_a/attempts/lucas__smoke_4__vae_baseline/precompute/precompute_latents.py
    deps:
      - acoustic_ai/layers/layer_a/attempts/lucas__smoke_4__vae_baseline/precompute/precompute_latents.py
      - acoustic_ai/layers/layer_a/attempts/lucas__smoke_4__vae_baseline/code/model.py
      - acoustic_ai/layers/layer_a/attempts/lucas__smoke_4__vae_baseline/code/dataset.py
      - acoustic_ai/layers/layer_a/attempts/lucas__smoke_4__vae_baseline/code/preprocess.py
      - model/candidates/lucas/vae-site257-30epoch/best.pt
      - resources/site_257_bowra-dry-a/site_257_training_manifest.csv
    params:
      - params.yaml:
          - ambient.top_k_retrieval
    outs:
      - acoustic_ai/layers/layer_a/attempts/lucas__smoke_4__vae_baseline/data/ambient/latents/latent_clips.npy:
          cache: true
      - acoustic_ai/layers/layer_a/attempts/lucas__smoke_4__vae_baseline/data/ambient/latents/latent_templates.npy:
          cache: true

  train_vocoder:
    cmd: python3 acoustic_ai/layers/layer_a/attempts/lucas__smoke_4__vae_baseline/code/train_vocoder.py
    deps:
      - acoustic_ai/layers/layer_a/attempts/lucas__smoke_4__vae_baseline/code/train_vocoder.py
      - resources/site_257_bowra-dry-a/site_257_training_manifest.csv
    params:
      - params.yaml:
          - vocoder.base_channels
          - vocoder.upsample_rates
          - vocoder.n_mels
          - vocoder.sample_rate
          - vocoder.epochs
          - vocoder.max_clips
          - vocoder.batch_size
          - vocoder.lr
    outs:
      - model/candidates/lucas/vocoder-hifigan-site257/best.pt:
          cache: true
