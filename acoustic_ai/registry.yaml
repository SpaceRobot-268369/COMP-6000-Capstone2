# Layer / attempt registry.
#
# Declarative source of truth for which models exist per layer. The FastAPI
# server reads this on startup to:
#   - serve GET /layers (for the frontend dropdown)
#   - resolve POST /layers/{layer}/attempts/{attempt_id}/generate to a handler
#
# Naming rules + artifact policy: .claude/context/conventions.md
# Handler interface: each attempt provides handler.py exporting load() + generate().
#
# Every GENERATION-layer attempt (layers A/B/C) declares its kind (conventions.md § 5.5):
#   kind: generative   → checkpoint: <model/candidates|production path>   (trained weights)
#   kind: retrieval    → asset_bank: <model/candidates|production path>   (media asset bank:
#                        index.json + media_asset_bank/ audio; JSON index only, no CSV)
# Both artifact kinds live under model/; only the attempt code lives under
# acoustic_ai/layers/.../attempts/. Layer D (mixer) and Layer E (analysis,
# keyed by `head:`) are not generation models and carry no `kind`.
#
# Retrieval entries are labelled with `kind` now, but still point at their
# in-attempt CSV banks (checkpoint: null + asset_index/retrieval_index under
# params). They gain `asset_bank:` + the model/ layout (index.json +
# media_asset_bank/) when their author migrates the bank.
#
# IDs use snake_case on disk; dropdown labels use human-readable strings.
# Canonical seed for samples/reference/ is 42 unless an attempt overrides it
# under `samples: { canonical_seed: <N> }`.

layers:

  layer_a:
    label: "Layer A — Ambient bed"
    default: lucas__prod_1__per_cell_loras
    attempts:

      lucas__smoke_1__audioldm2_spring_night:
        label: "Spring night (AudioLDM2 LoRA)"
        author: lucas
        stage: smoke_1
        status: smoke_test_1_success
        kind: generative
        uses_seed: true
        checkpoint: model/candidates/lucas/layer-a-audioldm2-raw-smoke
        params:
          base_model: cvssp/audioldm2
          prompt: >-
            quiet spring night ambient soundscape, Bowra dry woodland, Australia,
            distant environmental bed, no foreground events, no music, no machinery
          guidance_scale: 2.0
          num_inference_steps: 100
          audio_length_in_s: 10.0
          output_target_rms: 0.0015
          highpass_hz: 80.0
        notes:
          - Layer A dev endpoint is locked to the spring-night smoke prompt.
          - No user-specified prompts while the model is trained on the small smoke dataset.

      lucas__smoke_2__audioldm2_insects:
        label: "Insects/cicadas (AudioLDM2 LoRA)"
        author: lucas
        stage: smoke_2
        status: smoke_test_2_insects_success
        kind: generative
        uses_seed: true
        checkpoint: model/candidates/lucas/layer-a-audioldm2-insects-smoke
        params:
          base_model: cvssp/audioldm2
          prompt: >-
            summer afternoon insect-rich ambient soundscape, cicada and insect texture,
            Bowra dry woodland, Australia, dry hot air, distant environmental bed,
            no birds, no foreground events, no music, no machinery, no strong wind
          guidance_scale: 2.0
          num_inference_steps: 100
          audio_length_in_s: 10.0
          output_target_rms: 0.0015
          highpass_hz: 80.0
        notes:
          - Training data excludes annotated event overlaps and strong-wind rows.

      lucas__mvp_2__per_cell_loras:
        label: "Per-cell bank (16 season×diel LoRAs)"
        author: lucas
        stage: mvp_2
        status: mvp_2_per_cell_passed
        kind: generative
        uses_seed: true
        uses_cells: true
        checkpoint: model/candidates/lucas/mvp_2__per_cell_loras
        params:
          base_model: cvssp/audioldm2
          guidance_scale: 2.0
          num_inference_steps: 200
          audio_length_in_s: 10.0
          output_target_rms: 0.0015
          highpass_hz: 80.0
          default_cell: spring_night
          cells:
            spring_dawn:      {prompt: "dawn spring ambient soundscape, Bowra dry woodland, Australia, mild (18C), dry air, moderate wind, recorded 2019-10-04, no music, no machinery"}
            spring_morning:   {prompt: "morning spring ambient soundscape, Bowra dry woodland, Australia, mild (16C), dry air, moderate wind, recorded 2019-09-23, no music, no machinery"}
            spring_afternoon: {prompt: "afternoon spring ambient soundscape, Bowra dry woodland, Australia, warm (26C), dry air, light breeze, recorded 2019-09-01, no music, no machinery"}
            spring_night:     {prompt: "night spring ambient soundscape, Bowra dry woodland, Australia, mild (15C), dry air, light breeze, recorded 2019-09-01, no music, no machinery"}
            summer_dawn:      {prompt: "dawn summer ambient soundscape, Bowra dry woodland, Australia, warm (27C), dry air, moderate wind, recorded 2019-12-11, no music, no machinery"}
            summer_morning:   {prompt: "morning summer ambient soundscape, Bowra dry woodland, Australia, hot (34C), dry air, moderate wind, recorded 2019-12-11, no music, no machinery"}
            summer_afternoon: {prompt: "afternoon summer ambient soundscape, Bowra dry woodland, Australia, very hot (42C), dry air, moderate wind, recorded 2019-12-11, no music, no machinery"}
            summer_night:     {prompt: "night summer ambient soundscape, Bowra dry woodland, Australia, warm (28C), dry air, moderate wind, recorded 2019-12-11, no music, no machinery"}
            autumn_dawn:      {prompt: "dawn autumn ambient soundscape, Bowra dry woodland, Australia, mild (24C), dry air, light breeze, recorded 2020-03-02, no music, no machinery"}
            autumn_morning:   {prompt: "morning autumn ambient soundscape, Bowra dry woodland, Australia, warm (31C), dry air, moderate wind, recorded 2020-03-02, no music, no machinery"}
            autumn_afternoon: {prompt: "afternoon autumn ambient soundscape, Bowra dry woodland, Australia, hot (33C), dry air, moderate wind, recorded 2020-03-21, no music, no machinery"}
            autumn_night:     {prompt: "night autumn ambient soundscape, Bowra dry woodland, Australia, cold (14C), humid air, light breeze, recorded 2020-04-04, no music, no machinery"}
            winter_dawn:      {prompt: "dawn winter ambient soundscape, Bowra dry woodland, Australia, cold (10C), dry air, moderate wind, recorded 2019-08-18, no music, no machinery"}
            winter_morning:   {prompt: "morning winter ambient soundscape, Bowra dry woodland, Australia, cold (7C), moderate humidity, moderate wind, recorded 2019-08-14, no music, no machinery"}
            winter_afternoon: {prompt: "afternoon winter ambient soundscape, Bowra dry woodland, Australia, mild (20C), dry air, still, recorded 2019-08-14, no music, no machinery"}
            winter_night:     {prompt: "night winter ambient soundscape, Bowra dry woodland, Australia, cold (9C), moderate humidity, light breeze, recorded 2019-08-14, no music, no machinery"}
        notes:
          - 16 per-cell LoRAs (one per season×diel). Router swaps PEFT adapter by (season, diel).
          - Dev contract: runtime accepts seed + (season, diel); prompt locked per cell server-side.
          - summer_afternoon and autumn_dawn flagged for Phase 2.5 augmentation.

      lucas__prod_1__per_cell_loras:
        label: "Per-cell bank — PRODUCTION (16 season×diel LoRAs)"
        author: lucas
        stage: prod_1
        status: production
        kind: generative
        uses_seed: true
        uses_cells: true
        checkpoint: model/production/layer_a_ambient
        description: |
          Generates a 10-second ambient bed for a chosen season + time of day. Under the hood: 16 LoRA adapters (r=8, α=32) on top of `cvssp/audioldm2`, a frozen latent text-to-audio diffusion model — the server picks the adapter matching your scene and runs a locked per-cell caption.

          Trained on ~1,583 ten-second clips from site_257 Bowra dry woodland (caption schema v2, cap 200/cell, wind ≤5.5 m/s). Inference: 10 s mono @ 16 kHz, 200 diffusion steps, guidance 2.0, RMS-normalised with an 80 Hz high-pass.

          Promoted 2026-05-31 from `mvp_2`. Caveats: no long-form yet; `summer_afternoon` and `autumn_dawn` show mild overfit; `winter_morning`, `summer_morning`, `autumn_morning` are source-thin.
        params:
          base_model: cvssp/audioldm2
          guidance_scale: 2.0
          num_inference_steps: 200
          audio_length_in_s: 10.0
          output_target_rms: 0.0015
          highpass_hz: 80.0
          default_cell: spring_night
          cells:
            spring_dawn:      {prompt: "dawn spring ambient soundscape, Bowra dry woodland, Australia, mild (18C), dry air, moderate wind, recorded 2019-10-04, no music, no machinery"}
            spring_morning:   {prompt: "morning spring ambient soundscape, Bowra dry woodland, Australia, mild (16C), dry air, moderate wind, recorded 2019-09-23, no music, no machinery"}
            spring_afternoon: {prompt: "afternoon spring ambient soundscape, Bowra dry woodland, Australia, warm (26C), dry air, light breeze, recorded 2019-09-01, no music, no machinery"}
            spring_night:     {prompt: "night spring ambient soundscape, Bowra dry woodland, Australia, mild (15C), dry air, light breeze, recorded 2019-09-01, no music, no machinery"}
            summer_dawn:      {prompt: "dawn summer ambient soundscape, Bowra dry woodland, Australia, warm (27C), dry air, moderate wind, recorded 2019-12-11, no music, no machinery"}
            summer_morning:   {prompt: "morning summer ambient soundscape, Bowra dry woodland, Australia, hot (34C), dry air, moderate wind, recorded 2019-12-11, no music, no machinery"}
            summer_afternoon: {prompt: "afternoon summer ambient soundscape, Bowra dry woodland, Australia, very hot (42C), dry air, moderate wind, recorded 2019-12-11, no music, no machinery"}
            summer_night:     {prompt: "night summer ambient soundscape, Bowra dry woodland, Australia, warm (28C), dry air, moderate wind, recorded 2019-12-11, no music, no machinery"}
            autumn_dawn:      {prompt: "dawn autumn ambient soundscape, Bowra dry woodland, Australia, mild (24C), dry air, light breeze, recorded 2020-03-02, no music, no machinery"}
            autumn_morning:   {prompt: "morning autumn ambient soundscape, Bowra dry woodland, Australia, warm (31C), dry air, moderate wind, recorded 2020-03-02, no music, no machinery"}
            autumn_afternoon: {prompt: "afternoon autumn ambient soundscape, Bowra dry woodland, Australia, hot (33C), dry air, moderate wind, recorded 2020-03-21, no music, no machinery"}
            autumn_night:     {prompt: "night autumn ambient soundscape, Bowra dry woodland, Australia, cold (14C), humid air, light breeze, recorded 2020-04-04, no music, no machinery"}
            winter_dawn:      {prompt: "dawn winter ambient soundscape, Bowra dry woodland, Australia, cold (10C), dry air, moderate wind, recorded 2019-08-18, no music, no machinery"}
            winter_morning:   {prompt: "morning winter ambient soundscape, Bowra dry woodland, Australia, cold (7C), moderate humidity, moderate wind, recorded 2019-08-14, no music, no machinery"}
            winter_afternoon: {prompt: "afternoon winter ambient soundscape, Bowra dry woodland, Australia, mild (20C), dry air, still, recorded 2019-08-14, no music, no machinery"}
            winter_night:     {prompt: "night winter ambient soundscape, Bowra dry woodland, Australia, cold (9C), moderate humidity, light breeze, recorded 2019-08-14, no music, no machinery"}
        notes:
          - PRODUCTION promotion of lucas__mvp_2__per_cell_loras (conventions §5.4).
          - Checkpoint = model/production/layer_a_ambient (pointer copy of the candidate bank).
          - Promoted with caveats — see the production card audit section.

      lucas__smoke_4__vae_baseline:
        label: "VAE + HiFi-GAN baseline (legacy /analysis backing)"
        author: lucas
        stage: smoke_4
        status: superseded
        kind: generative
        checkpoint: model/candidates/lucas/vae-site257-30epoch
        extra_checkpoints:
          vocoder: model/candidates/lucas/vocoder-hifigan-site257
        params:
          sample_rate: 22050
          n_mels: 128
          latent_dim: 256
        notes:
          - Pre-AudioLDM2 retrieval+VAE+vocoder pipeline. Still backs /analysis.

  layer_b:
    label: "Layer B — Weather"
    default: murphy__mvp_1__weather_stem_selector
    attempts:
      murphy__mvp_1__wind_intensity_bank:
        label: "Generate wind — intensity bank"
        author: murphy
        stage: mvp_1
        status: mvp_candidate
        kind: generative
        uses_seed: true
        checkpoint: model/candidates/murphy/mvp_1__wind_intensity_bank
        description: |
          Generates wind-only Layer B weather stems from the sealed AudioLDM2
          wind intensity bank. This is the frontend-facing model test for
          layerB_generate_wind and sits beside, not in place of, the site-only
          weather stem selector.

          Runtime controls are seed and wind intensity. Weather type is fixed to
          wind. The sealed profiles are: light = v2 light_a with 6 kHz lowpass,
          medium = v3 denoise bump, and heavy = v2 frozen. Medium and heavy use
          LoRA adapters; light is derived from medium.

          Output is a generated WAV plus metadata for review in the developer
          Generation page. Layer D still owns final placement and full
          soundscape mixing.
        params:
          base_model: cvssp/audioldm2
          default_intensity: medium
          intensity_profile_version: sealed
          num_inference_steps: 200
          audio_length_in_s: 8.0
          denoise_enabled: true
          denoise_strength: 0.15
          denoise_noise_quantile: 0.2
          denoise_floor_ratio: 0.40
          denoise_hop_length: 512
          fade_ms: 80.0
          negative_prompt: >-
            hiss, static noise, background hum, tape noise, insects, low quality, distortion
          intensity_profiles:
            heavy:
              adapter: heavy
              prompt: >-
                loud roaring blustery wind through dry eucalyptus woodland, intense strong gusts,
                Bowra, Australia
              guidance_scale: 3.4
              output_target_rms: 0.09
              highpass_hz: 80.0
              denoise_strength: 0.15
              denoise_floor_ratio: 0.40
            medium:
              adapter: medium
              prompt: >-
                steady wind through dry eucalyptus woodland, gentle natural breeze,
                Bowra, Australia
              guidance_scale: 3.0
              output_target_rms: 0.048
              highpass_hz: 80.0
              denoise_strength: 0.19
              denoise_floor_ratio: 0.38
            light:
              derived_from: medium
              prompt: >-
                gentle light breeze through dry eucalyptus woodland, soft faint airflow,
                Bowra, Australia
              guidance_scale: 2.5
              output_target_rms: 0.045
              highpass_hz: 80.0
              lowpass_hz: 6000.0
              denoise_strength: 0.22
              denoise_floor_ratio: 0.30
        notes:
          - Sealed profiles (2026-06-04): light=light_a, medium=v3, heavy=v2.
          - medium/heavy are true adapters; light is parametric-derived from medium.
          - Runtime expects weather_type=wind and intensity in {light,medium,heavy}.

      murphy__mvp_1__rain_intensity_seed_pool:
        label: "Generate rain — curated intensity seed pool"
        author: murphy
        stage: mvp_1
        status: mvp_candidate
        kind: generative
        uses_seed: true
        checkpoint: model/candidates/murphy/mvp_1__rain_intensity_seed_pool
        description: |
          Generates rain-only Layer B weather stems from the AudioLDM2 rain
          LoRA, constrained to a curated MVP pool of good seeds selected from
          the a2 intensity listening audit. Runtime seed is deterministic
          entropy into the selected intensity bucket, not an unrestricted model
          seed. This keeps frontend testing inside the reviewed rain outputs.

          Runtime controls are seed entropy and rain intensity. Weather type is
          fixed to rain. Supported intensity buckets are light and heavy.
        params:
          base_model: cvssp/audioldm2
          prompt: >-
            steady rain over dry eucalyptus woodland,
            Bowra, Australia
          negative_prompt: >-
            hiss, static noise, background hum, tape noise, birds, insects,
            wind gusts, reverb, music, machinery, low quality, distortion
          guidance_scale: 3.0
          num_inference_steps: 200
          audio_length_in_s: 5.0
          output_target_rms: 0.05
          highpass_hz: 80.0
          seed_mode: curated_intensity_pool
          intensity_profile_version: a2_intensity_audit_20260607
          intensities: [light, heavy]
          default_intensity: light
          good_seeds_by_intensity:
            light: [42, 43, 44, 51, 999983, 38891, 126481, 4935269, 7257523, 9368669, 10424237, 11057581, 349687]
            heavy: [46, 48, 2000000001, 123456789, 69317, 349681, 1649669, 1860781, 3549697, 8101981, 10213123, 10635353, 11902037, 69323, 7257533]
          bwe_enabled: true
          bwe:
            cross_over_hz: 8000.0
            output_sr: 24000
            output_sample_rate_hz: 24000
            sbr_source_low_hz: 4000.0
            sbr_source_high_hz: 7900.0
            sbr_shift_hz: 4000.0
            sbr_target_low_hz: 8000.0
            sbr_target_high_hz: 11800.0
            noise_low_hz: 8000.0
            noise_high_hz: 11800.0
            envelope_source_low_hz: 3000.0
            envelope_source_high_hz: 7900.0
            envelope_smooth_ms: 35.0
            noise_to_sbr_rms_ratio: 0.35
            target_drop_8_11_minus_2_8_db: -10.985337681240505
            post_bwe_highband_trim_db: -2.75
            denoise_enabled: false
          denoise_enabled: false
          denoise_strength: 0.15
          denoise_noise_quantile: 0.2
          denoise_floor_ratio: 0.38
          denoise_hop_length: 512
          fade_ms: 20.0
        notes:
          - MVP seed pool comes from a2_intensity_audit_20260607.
          - Runtime seed maps deterministically into the selected good-seed bucket.
          - Raw listening WAVs are not committed; audit CSVs document the pool.

      murphy__mvp_1__weather_stem_selector:
        label: "Weather stem selector — site-only MVP"
        author: murphy
        stage: mvp_1
        status: mvp_candidate
        kind: retrieval
        asset_bank: model/candidates/murphy/mvp_1__weather_stem_selector
        uses_seed: true
        uses_weather_controls: true
        checkpoint: null
        description: |
          Selects a short weather-only stem for a chosen weather type, intensity, and duration. Under the hood: a site-only retrieval pool from site_257 Bowra dry woodland is filtered by weather label and intensity, then retrieval_seed chooses a deterministic site asset and start offset.

          Pool contents: 113 site-derived WAV stems promoted from CLAP/env/manual weather screening (6 rain, 12 rain+wind, 93 wind, 2 thunder backup). Curated sound-library assets remain documented in the index but are marked unavailable on this branch and are excluded from the runtime pool. The two thunder backup stems are intentionally not exposed in the frontend/API until the site thunder policy is reliable. Runtime output: a short WAV weather stem, RMS-normalised by requested intensity, for Layer D to place and mix into the final soundscape.

          Supported site weather types in this branch: rain, wind, and rain+wind. Site thunder/storm/rain+thunder/rain+thunder+wind are not exposed until reliable site-derived storm candidates are promoted. Runtime controls: weather_type, intensity, duration_s, and retrieval_seed. This is an asset-selection MVP, not a trained weather generator and not a full soundscape renderer.
        params:
          default_weather_type: rain
          default_intensity: medium
          default_duration_s: 10.0
          target_rms:
            light: 0.035
            medium: 0.050
            heavy: 0.070
          peak_ceiling: 0.95
        notes:
          - First frontend-facing Layer B MVP.
          - Layer B outputs a short weather stem; Layer D owns final placement and full soundscape mixing.
          - Runtime parameters are weather_type, intensity, duration_s, and retrieval_seed.

      murphy__smoke_1__curated_assets:
        label: "Curated wind/rain assets"
        author: lucas
        stage: smoke_1
        status: placeholder
        kind: retrieval
        checkpoint: null
        params: {}
        notes:
          - Asset library + parameter mixing, no trained model.

  layer_c:
    label: "Layer C — Events"
    default: burger__mvp_3__sa3_generative_live
    attempts:
      lucas__smoke_1__audiogen_boobook:
        label: "Boobook owl (AudioGen LoRA)"
        author: lucas
        stage: smoke_1
        status: smoke_test_1_success
        kind: generative
        uses_seed: true
        checkpoint: model/candidates/lucas/layer-c-audiogen-boobook-smoke
        params:
          base_model: facebook/audiogen-medium
          sample_rate: 16000
        notes:
          - Per-species LoRA; 16 kHz native.

      burger__mvp_2__retrieval_v2_library:
        label: "Layer C retrieval v2 audited library"
        author: burger
        stage: mvp_2
        status: demo_ready
        kind: retrieval
        uses_seed: true
        uses_cells: true
        checkpoint: null
        asset_bank: model/candidates/burger/mvp_2__retrieval_v2_library
        description: |
          Layer C retrieval v2 baseline backed by the rebuilt 63-species
          audited library. It selects one real Pass-reviewed snippet from the
          v2 event index and returns the clip at its natural duration.
        params:
          method: retrieval
          species_common_name: "Splendid Fairywren"
          event_type: layer_c_retrieval_v2_library
          count: 1
          default_cell: summer_morning
          default_season: summer
          default_diel: morning
          ecological_mode: true
          enable_variation: false
          layer_c_only: true
          ambient_gain_db: -26.0
          events_gain_db: -2.0
          cells:
            spring_dawn: {}
            spring_morning: {}
            spring_afternoon: {}
            spring_night: {}
            summer_dawn: {}
            summer_morning: {}
            summer_afternoon: {}
            summer_night: {}
            autumn_dawn: {}
            autumn_morning: {}
            autumn_afternoon: {}
            autumn_night: {}
            winter_dawn: {}
            winter_morning: {}
            winter_afternoon: {}
            winter_night: {}
        notes:
          - Uses the v2 Pass manifest with 4,329 snippets across 63 species.
          - Pacific Swift has 9 snippets because the v2 candidate pool only had 9 valid candidates.
          - Default species is Splendid Fairywren; params can be copied for other species-specific retrieval demos.

      burger__mvp_3__sa3_generative_live:
        label: "Layer C SA3 LoRA generative live model"
        author: burger
        stage: mvp_3
        status: experimental
        kind: generative
        uses_seed: true
        checkpoint: null
        description: |
          Layer C generative live endpoint. This attempt loads the Stable
          Audio 3 LoRA checkpoint at request time, generates a new waveform
          for the requested seed, then applies species-specific post-processing.
          It should be run on the GPU worker, not on a local CPU-only server.
        deploy_dvc:
          - model/candidates/burger/layer-c-sa3-horsfields-bronze-cuckoo-pass35-captionv2-t2a1000/lora_checkpoints/epoch=28-step=1000.ckpt.dvc
          - model/candidates/burger/layer-c-sa3-spotted-nightjar-core30-human-bandpass-step1200/lora_checkpoints/epoch=39-step=1200.ckpt.dvc
          - acoustic_ai/layers/layer_c/attempts/burger__mvp_3__sa3_generative_live/expected/horsfields_bronze_cuckoo/audio.wav.dvc
          - acoustic_ai/layers/layer_c/attempts/burger__mvp_3__sa3_generative_live/expected/spotted_nightjar/audio.wav.dvc
        params:
          method: sa3_lora_generative_live
          base_model: Stable Audio 3 small-sfx-base
          live_output_root: debug/layer_c/sa3_live_api
          default_species_common_name: "Horsfield's Bronze-cuckoo"
          species_pools:
            horsfields_bronze_cuckoo:
              species_common_name: "Horsfield's Bronze-cuckoo"
              event_type: horsfields_bronze_cuckoo
              source_checkpoint: model/candidates/burger/layer-c-sa3-horsfields-bronze-cuckoo-pass35-captionv2-t2a1000/lora_checkpoints/epoch=28-step=1000.ckpt
              checkpoint_step: 1000
              prompt: "isolated Horsfields Bronze-cuckoo call, short repeated descending whistle motif around 2-4 kHz, clean foreground bird vocalization, no wind noise, no insects, no other birds"
              duration_s: 3.0
              sampling_cfg_scale: 4.0
              sampling_steps: 50
              default_season: summer
              default_diel: morning
              postprocess:
                mode: target_call_detection_timeline
                bandpass_hz: [2100, 4100]
                detector: cuckoo_descending_ridge_detector_v1
                pre_buffer_s: 0.14
                post_buffer_s: 0.18
                min_score: 0.68
                min_contrast_score: 0.7
            spotted_nightjar:
              species_common_name: "Spotted Nightjar"
              event_type: spotted_nightjar
              source_checkpoint: model/candidates/burger/layer-c-sa3-spotted-nightjar-core30-human-bandpass-step1200/lora_checkpoints/epoch=39-step=1200.ckpt
              checkpoint_step: 1200
              prompt: "low pulsing Spotted Nightjar churring bird call, narrow low frequency nocturnal call, isolated foreground wildlife sound"
              duration_s: 5.0
              sampling_cfg_scale: 4.0
              sampling_steps: 50
              default_season: summer
              default_diel: night
              postprocess:
                mode: s3a_tight_tailcrop335
                bandpass_hz: [550, 950]
                spectral_gate_strength: 0.3
                target_rms: 0.035
                fade_ms: 120
                crop_end_s: 3.35
        notes:
          - Runs actual SA3 LoRA inference at request time; first response may be slow.
          - Requires Stable Audio 3 dependencies, model access, and CUDA on the worker.
          - Expected samples are real audited bird-call references, one per species.
          - This is the single Layer C SA3 generative route; runtime species selection switches checkpoints and post-processing.

  layer_d:
    label: "Layer D — Mixer"
    default: songke__mvp_1__layered_mix
    attempts:
      songke__mvp_1__layered_mix:
        label: "Layered mix"
        author: songke
        stage: mvp_1
        status: mvp_candidate
        checkpoint: null
        description: |
          Final Layer D mixer for the generation pipeline. Receives upstream
          Layer A ambient, Layer B weather, and Layer C event WAV stems,
          normalizes their technical format, aligns them to the target
          duration, applies gain staging, weather smoothing, event fade
          smoothing, event band-pass cleanup, and peak protection, then returns
          the final mixed soundscape WAV with traceable mix metadata.
        params:
          default_duration_s: 30.0
          weather_gain_db: -12.0
          event_gain_db: -18.0
          event_activity_envelope: true
          event_boundary_fade_s: 1.0
          event_bandpass_hz: [500.0, 8000.0]
          peak_ceiling: 0.95
        notes:
          - Combines A+B+C outputs into final WAV + explanation JSON.
          - Current preferred listening configuration is local mix attempt v5.
          - Handler accepts upstream WAV bytes from a generation orchestrator.

      songke__mvp_2__multi_clip_mix:
        label: "Multi-clip timeline mix"
        author: songke
        stage: mvp_2
        status: implemented_not_default
        checkpoint: null
        description: |
          Handler-level Layer D multi-clip mixer for the next generation
          pipeline. Accepts one Layer A ambient bed plus zero or more Layer B
          weather clips and Layer C event clips, supports continuous weather
          beds, discrete placed weather clips, multiple event clips, explicit
          onset lists, seeded random onset fallback, per-clip gain overrides,
          peak protection, and reviewer-facing placed-clip metadata. Registered
          and routable through the generation orchestrator when selected, but
          not the Layer D default until real A/B/C listening checks are
          complete.
        params:
          default_duration_s: 30.0
          weather_gain_db: -2.0
          event_gain_db: -8.0
          event_activity_envelope: true
          event_boundary_fade_s: 1.0
          event_bandpass_hz: [500.0, 8000.0]
          peak_ceiling: 0.95
          placement_seed_default: 42
        notes:
          - Handler-level multi-clip contract is implemented and covered by tests.
          - Backward-compatible with the mvp_1 single-stem handler parameters while the orchestrator catches up.
          - Do not promote to layer_d default until real A/B/C listening checks are complete.

  layer_e:
    label: "Layer E — Analysis"
    default: lucas__mvp_2__clap_knn_probe_enlarged
    # Analysis runs three independent detector heads on the raw mixture
    # (pipeline_design.md § Analysis Mode): E-A ambient context, E-B weather,
    # E-C events. Each attempt declares which head it serves via `head:`
    # (ambient | weather | events). The Analysis dev page groups the per-head
    # model picker by this field — an attempt with no `head` is not offered in
    # any head. Heads with no real model (weather, events today) render empty.
    attempts:
      lucas__mvp_2__clap_knn_probe_enlarged:
        label: "Ambient context — CLAP k-NN + probe (enlarged pool)"
        author: lucas
        stage: mvp_2
        head: ambient
        status: candidate
        checkpoint: model/candidates/lucas/mvp_2__clap_knn_probe_enlarged
        description: |
          Estimates the ambient context of an uploaded clip — season and time of day (diel) plus an hour/month guess — and surfaces the nearest training clips. Under the hood: frozen `laion/clap-htsat-unfused` CLAP embeddings feed a k=5 nearest-neighbour vote (τ=0.1) and a 1-hidden-layer MLP season probe (hidden 256, seed 42).

          Trained on `resources/site_257_bowra-dry-a/ambient_pool_v2` (the enlarged pool). Metrics: probe season acc **0.553** vs k-NN **0.512** (+0.041), diel **0.706**, hour MAE **1.97 h**, month MAE **1.80 mo**. The season probe beats the k-NN baseline but still misses the 0.60 candidate bar; diel/hour/month clear their bars.

          Output (report JSON): `estimated_conditions` — season, diel bin, hour, month; `similar_clips` — top-k nearest training segments with similarity scores (the evidence behind the estimate); `confidence` — mean neighbour similarity; `season_confidence` — the probe's softmax for the predicted season; `ood_flag` — raised when the clip's k-NN cell vote disagrees with its anchors (likely outside the Bowra training distribution). The `k` (5) and `tau` (0.1) settings are echoed back for traceability.

          Interaction: the three Analysis heads run independently on the raw mixture (no wired cross-head call yet), but by design this head feeds the event head (E-C). E-A's estimated season/diel/hour is the ecological prior for which species are plausible — Bowra species are strongly gated by time of day and season (nocturnal callers ~22:00–05:00, summer-only insects), the same context Layer C uses to select events. So ambient context turns E-C's open-class detections into context-aware ones: a dawn-chorus species flagged in a clip placed at night is a red flag, not a confident hit. E-A and E-C also share the frozen CLAP encoder, and `estimated_conditions` can later drive Generation (Layer A per-cell bank + Layer C species choice), closing the analysis→generation loop.

          Status: candidate (E-A default). Serves the Ambient head via `POST /layers/layer_e/attempts/{id}/analyze`.
        params:
          k: 5
          tau: 0.1
          ood_conf_threshold: 0.25
        notes:
          - Candidate E-A ambient analysis model trained on ambient_pool_v2.
          - MLP season probe improves over k-NN season (0.553 vs 0.512) but misses the 0.60 bar.
          - Diel/hour/month heads pass the candidate bars.
          - Serves the E-A head of the Analysis dev page via POST /layers/layer_e/attempts/{id}/analyze (handler.analyze).

      lucas__mvp_1__clap_knn_probe:
        label: "Ambient context — CLAP k-NN + probe (v0 pool)"
        author: lucas
        stage: mvp_1
        head: ambient
        status: parked_negative
        checkpoint: model/candidates/lucas/mvp_1__clap_knn_probe
        description: |
          The v0 baseline of the ambient-context head: same recipe as the enlarged candidate (frozen `laion/clap-htsat-unfused` CLAP → k-NN season vote + a small season probe), but trained on the original 1,982-segment single-site pool.

          Documented **negative result**: the season probe does not beat the k-NN season baseline (0.522) on v0 data — linear val acc 0.445 (underfits), MLP val acc 0.491 (overfits, train 0.755). Kept as a reproducibility baseline for the enlarged-pool retry; serving falls back to the k-NN season vote.

          Output: same report shape as the enlarged candidate — `estimated_conditions` (season, diel, hour, month), `similar_clips`, `confidence`, `season_confidence`, `ood_flag`. Interaction: same intended role — ambient context as the ecological prior for the E-C event head — but this v0 probe is parked, so it is not the served E-A path.

          Status: parked (negative). Superseded by `lucas__mvp_2__clap_knn_probe_enlarged`.
        params:
          k: 5
          tau: 0.1
          ood_conf_threshold: 0.25
        notes:
          - Parked baseline trained on the original 1,982-segment pool.
          - Probe did not beat the k-NN season baseline on v0 data.

      songke__prod_1__e_c_species_event_detector:
        label: "Known species event detector - PRODUCTION"
        author: songke
        stage: prod_1
        head: events
        status: production
        checkpoint: model/production/layer_e_c_species_event_detector
        params:
          threshold: 0.55
          window_s: 5.0
          hop_s: 1.0
          merge_gap_s: 1.0
          min_event_windows: 7
        notes:
          - Production E-C detector promoted from songke__smoke_2__known_species_clap_probe for the online Analysis Mode demo.
          - Supports 13 known Australian species using frozen LAION-CLAP embeddings plus an MLP probe.
          - Test accuracy is 0.817 and macro-F1 is 0.811 on the 2842-clip manifest.
          - Returns event confidence, species matches, phenology metadata, and an aggregator-ready analysis_report.
          - The production checkpoint is automatically materialised by the Server B model sync workflow.

      songke__smoke_2__known_species_clap_probe:
        label: "Known species events - CLAP probe"
        author: songke
        stage: smoke_2
        head: events
        status: candidate
        checkpoint: model/candidates/songke/mvp_1__layer_e_species_event_detector
        params:
          threshold: 0.55
          window_s: 5.0
          hop_s: 1.0
          merge_gap_s: 1.0
          min_event_windows: 7
        notes:
          - E-C known-species detector for ninox_boobook, laughing_kookaburra, rhipidura_leucophrys, psophodes_cristatus, cincloramphus_mathewsi, podargus_strigoides, red_capped_robin, anas_superciliosa, australian_raven, peaceful_dove, galah, crested_bellbird, and rainbow_bee_eater.
          - Uses frozen LAION-CLAP audio embeddings plus a local MLP probe trained from xeno-canto clips.
          - Local no-magpie 13-class CLAP probe test accuracy is 0.817 and macro-F1 is 0.811 on the 2842-clip manifest.
          - Enriches each detected species event with a conservative phenology block for report synthesis.
          - Emits an analysis_report block with observations, inferred_context, and disagreements for aggregator integration.
          - Serves the E-C events head via POST /layers/layer_e/attempts/{id}/analyze.

      murphy__mvp_1__weather_direct_detection:
        label: "Weather analysis — CLAP + PANNs + AST gate v1.1"
