# Layer / attempt registry.
#
# Declarative source of truth for which models exist per layer. The FastAPI
# server reads this on startup to:
#   - serve GET /layers (for the frontend dropdown)
#   - resolve POST /layers/{layer}/attempts/{attempt_id}/generate to a handler
#
# Naming rules:    .claude/context/dev/attempt_naming.md
# Artifact policy: .claude/context/dev/artifact_policy.md
# Handler interface: each attempt provides handler.py exporting load() + generate().
#
# IDs use snake_case on disk; dropdown labels use human-readable strings.
# Canonical seed for samples/reference/ is 42 unless an attempt overrides it
# under `samples: { canonical_seed: <N> }`.

layers:

  layer_a:
    label: "Layer A — Ambient bed"
    default: lucas__prod_1__per_cell_loras
    attempts:

      lucas__smoke_1__audioldm2_spring_night:
        label: "Spring night (AudioLDM2 LoRA)"
        author: lucas
        stage: smoke_1
        status: smoke_test_1_success
        uses_seed: true
        checkpoint: model/candidates/lucas/layer-a-audioldm2-raw-smoke
        params:
          base_model: cvssp/audioldm2
          prompt: >-
            quiet spring night ambient soundscape, Bowra dry woodland, Australia,
            distant environmental bed, no foreground events, no music, no machinery
          guidance_scale: 2.0
          num_inference_steps: 100
          audio_length_in_s: 10.0
          output_target_rms: 0.0015
          highpass_hz: 80.0
        notes:
          - Layer A dev endpoint is locked to the spring-night smoke prompt.
          - No user-specified prompts while the model is trained on the small smoke dataset.

      lucas__smoke_2__audioldm2_insects:
        label: "Insects/cicadas (AudioLDM2 LoRA)"
        author: lucas
        stage: smoke_2
        status: smoke_test_2_insects_success
        uses_seed: true
        checkpoint: model/candidates/lucas/layer-a-audioldm2-insects-smoke
        params:
          base_model: cvssp/audioldm2
          prompt: >-
            summer afternoon insect-rich ambient soundscape, cicada and insect texture,
            Bowra dry woodland, Australia, dry hot air, distant environmental bed,
            no birds, no foreground events, no music, no machinery, no strong wind
          guidance_scale: 2.0
          num_inference_steps: 100
          audio_length_in_s: 10.0
          output_target_rms: 0.0015
          highpass_hz: 80.0
        notes:
          - Training data excludes annotated event overlaps and strong-wind rows.

      lucas__mvp_2__per_cell_loras:
        label: "Per-cell bank (16 season×diel LoRAs)"
        author: lucas
        stage: mvp_2
        status: mvp_2_per_cell_passed
        uses_seed: true
        uses_cells: true
        checkpoint: model/candidates/lucas/mvp_2__per_cell_loras
        params:
          base_model: cvssp/audioldm2
          guidance_scale: 2.0
          num_inference_steps: 200
          audio_length_in_s: 10.0
          output_target_rms: 0.0015
          highpass_hz: 80.0
          default_cell: spring_night
          cells:
            spring_dawn:      {prompt: "dawn spring ambient soundscape, Bowra dry woodland, Australia, mild (18C), dry air, moderate wind, recorded 2019-10-04, no music, no machinery"}
            spring_morning:   {prompt: "morning spring ambient soundscape, Bowra dry woodland, Australia, mild (16C), dry air, moderate wind, recorded 2019-09-23, no music, no machinery"}
            spring_afternoon: {prompt: "afternoon spring ambient soundscape, Bowra dry woodland, Australia, warm (26C), dry air, light breeze, recorded 2019-09-01, no music, no machinery"}
            spring_night:     {prompt: "night spring ambient soundscape, Bowra dry woodland, Australia, mild (15C), dry air, light breeze, recorded 2019-09-01, no music, no machinery"}
            summer_dawn:      {prompt: "dawn summer ambient soundscape, Bowra dry woodland, Australia, warm (27C), dry air, moderate wind, recorded 2019-12-11, no music, no machinery"}
            summer_morning:   {prompt: "morning summer ambient soundscape, Bowra dry woodland, Australia, hot (34C), dry air, moderate wind, recorded 2019-12-11, no music, no machinery"}
            summer_afternoon: {prompt: "afternoon summer ambient soundscape, Bowra dry woodland, Australia, very hot (42C), dry air, moderate wind, recorded 2019-12-11, no music, no machinery"}
            summer_night:     {prompt: "night summer ambient soundscape, Bowra dry woodland, Australia, warm (28C), dry air, moderate wind, recorded 2019-12-11, no music, no machinery"}
            autumn_dawn:      {prompt: "dawn autumn ambient soundscape, Bowra dry woodland, Australia, mild (24C), dry air, light breeze, recorded 2020-03-02, no music, no machinery"}
            autumn_morning:   {prompt: "morning autumn ambient soundscape, Bowra dry woodland, Australia, warm (31C), dry air, moderate wind, recorded 2020-03-02, no music, no machinery"}
            autumn_afternoon: {prompt: "afternoon autumn ambient soundscape, Bowra dry woodland, Australia, hot (33C), dry air, moderate wind, recorded 2020-03-21, no music, no machinery"}
            autumn_night:     {prompt: "night autumn ambient soundscape, Bowra dry woodland, Australia, cold (14C), humid air, light breeze, recorded 2020-04-04, no music, no machinery"}
            winter_dawn:      {prompt: "dawn winter ambient soundscape, Bowra dry woodland, Australia, cold (10C), dry air, moderate wind, recorded 2019-08-18, no music, no machinery"}
            winter_morning:   {prompt: "morning winter ambient soundscape, Bowra dry woodland, Australia, cold (7C), moderate humidity, moderate wind, recorded 2019-08-14, no music, no machinery"}
            winter_afternoon: {prompt: "afternoon winter ambient soundscape, Bowra dry woodland, Australia, mild (20C), dry air, still, recorded 2019-08-14, no music, no machinery"}
            winter_night:     {prompt: "night winter ambient soundscape, Bowra dry woodland, Australia, cold (9C), moderate humidity, light breeze, recorded 2019-08-14, no music, no machinery"}
        notes:
          - 16 per-cell LoRAs (one per season×diel). Router swaps PEFT adapter by (season, diel).
          - Dev contract: runtime accepts seed + (season, diel); prompt locked per cell server-side.
          - summer_afternoon and autumn_dawn flagged for Phase 2.5 augmentation.

      lucas__prod_1__per_cell_loras:
        label: "Per-cell bank — PRODUCTION (16 season×diel LoRAs)"
        author: lucas
        stage: prod_1
        status: production
        uses_seed: true
        uses_cells: true
        checkpoint: model/production/layer_a_ambient
        description: |
          Generates a 10-second ambient bed for a chosen season + time of day. Under the hood: 16 LoRA adapters (r=8, α=32) on top of `cvssp/audioldm2`, a frozen latent text-to-audio diffusion model — the server picks the adapter matching your scene and runs a locked per-cell caption.

          Trained on ~1,583 ten-second clips from site_257 Bowra dry woodland (caption schema v2, cap 200/cell, wind ≤5.5 m/s). Inference: 10 s mono @ 16 kHz, 200 diffusion steps, guidance 2.0, RMS-normalised with an 80 Hz high-pass.

          Promoted 2026-05-31 from `mvp_2`. Caveats: no long-form yet; `summer_afternoon` and `autumn_dawn` show mild overfit; `winter_morning`, `summer_morning`, `autumn_morning` are source-thin.
        params:
          base_model: cvssp/audioldm2
          guidance_scale: 2.0
          num_inference_steps: 200
          audio_length_in_s: 10.0
          output_target_rms: 0.0015
          highpass_hz: 80.0
          default_cell: spring_night
          cells:
            spring_dawn:      {prompt: "dawn spring ambient soundscape, Bowra dry woodland, Australia, mild (18C), dry air, moderate wind, recorded 2019-10-04, no music, no machinery"}
            spring_morning:   {prompt: "morning spring ambient soundscape, Bowra dry woodland, Australia, mild (16C), dry air, moderate wind, recorded 2019-09-23, no music, no machinery"}
            spring_afternoon: {prompt: "afternoon spring ambient soundscape, Bowra dry woodland, Australia, warm (26C), dry air, light breeze, recorded 2019-09-01, no music, no machinery"}
            spring_night:     {prompt: "night spring ambient soundscape, Bowra dry woodland, Australia, mild (15C), dry air, light breeze, recorded 2019-09-01, no music, no machinery"}
            summer_dawn:      {prompt: "dawn summer ambient soundscape, Bowra dry woodland, Australia, warm (27C), dry air, moderate wind, recorded 2019-12-11, no music, no machinery"}
            summer_morning:   {prompt: "morning summer ambient soundscape, Bowra dry woodland, Australia, hot (34C), dry air, moderate wind, recorded 2019-12-11, no music, no machinery"}
            summer_afternoon: {prompt: "afternoon summer ambient soundscape, Bowra dry woodland, Australia, very hot (42C), dry air, moderate wind, recorded 2019-12-11, no music, no machinery"}
            summer_night:     {prompt: "night summer ambient soundscape, Bowra dry woodland, Australia, warm (28C), dry air, moderate wind, recorded 2019-12-11, no music, no machinery"}
            autumn_dawn:      {prompt: "dawn autumn ambient soundscape, Bowra dry woodland, Australia, mild (24C), dry air, light breeze, recorded 2020-03-02, no music, no machinery"}
            autumn_morning:   {prompt: "morning autumn ambient soundscape, Bowra dry woodland, Australia, warm (31C), dry air, moderate wind, recorded 2020-03-02, no music, no machinery"}
            autumn_afternoon: {prompt: "afternoon autumn ambient soundscape, Bowra dry woodland, Australia, hot (33C), dry air, moderate wind, recorded 2020-03-21, no music, no machinery"}
            autumn_night:     {prompt: "night autumn ambient soundscape, Bowra dry woodland, Australia, cold (14C), humid air, light breeze, recorded 2020-04-04, no music, no machinery"}
            winter_dawn:      {prompt: "dawn winter ambient soundscape, Bowra dry woodland, Australia, cold (10C), dry air, moderate wind, recorded 2019-08-18, no music, no machinery"}
            winter_morning:   {prompt: "morning winter ambient soundscape, Bowra dry woodland, Australia, cold (7C), moderate humidity, moderate wind, recorded 2019-08-14, no music, no machinery"}
            winter_afternoon: {prompt: "afternoon winter ambient soundscape, Bowra dry woodland, Australia, mild (20C), dry air, still, recorded 2019-08-14, no music, no machinery"}
            winter_night:     {prompt: "night winter ambient soundscape, Bowra dry woodland, Australia, cold (9C), moderate humidity, light breeze, recorded 2019-08-14, no music, no machinery"}
        notes:
          - PRODUCTION promotion of lucas__mvp_2__per_cell_loras (conventions §5.4).
          - Checkpoint = model/production/layer_a_ambient (pointer copy of the candidate bank).
          - Promoted with caveats — see the production card audit section.

      lucas__smoke_4__vae_baseline:
        label: "VAE + HiFi-GAN baseline (legacy /analysis backing)"
        author: lucas
        stage: smoke_4
        status: superseded
        checkpoint: model/candidates/lucas/vae-site257-30epoch
        extra_checkpoints:
          vocoder: model/candidates/lucas/vocoder-hifigan-site257
        params:
          sample_rate: 22050
          n_mels: 128
          latent_dim: 256
        notes:
          - Pre-AudioLDM2 retrieval+VAE+vocoder pipeline. Still backs /analysis.

  layer_b:
    label: "Layer B — Weather"
    default: murphy__mvp_1__weather_stem_selector
    attempts:
      murphy__smoke_1__audioldm2_wind:
        label: "Wind-only generate smoke (AudioLDM2 LoRA)"
        author: murphy
        stage: smoke_1
        status: smoke_candidate
        uses_seed: true
        checkpoint: model/candidates/murphy/smoke_1__audioldm2_wind
        description: |
          Layer B generate-route smoke attempt for single-element wind synthesis.
          Uses a locked prompt and seed-driven AudioLDM2 + LoRA inference to
          produce a short wind stem. This attempt is generation-only and does
          not use the retrieval pool at runtime.
        params:
          base_model: cvssp/audioldm2
          prompt: >-
            steady wind through dry woodland trees, Bowra dry woodland, Australia,
            no music, no machinery, no birds, no insects
          guidance_scale: 2.0
          num_inference_steps: 100
          audio_length_in_s: 10.0
          output_target_rms: 0.02
          highpass_hz: 80.0
        notes:
          - Layer B generate-path smoke for wind only.
          - Runtime accepts seed only; prompt and generation params are server-locked.
          - Training data comes from a filtered wind-only manifest built from site pool.

      murphy__mvp_1__wind_intensity_bank:
        label: "Wind intensity bank (generate, medium/heavy + derived light)"
        author: murphy
        stage: mvp_1
        status: mvp_candidate
        uses_seed: true
        checkpoint: model/candidates/murphy/mvp_1__wind_intensity_bank
        description: |
          Layer B wind intensity bank (sealed). light = v2 light_a (lowpass 6k);
          medium = v3 denoise bump; heavy = v2 frozen. medium/heavy use LoRA
          adapters; light is derived from medium.
        params:
          base_model: cvssp/audioldm2
          default_intensity: medium
          intensity_profile_version: sealed
          num_inference_steps: 200
          audio_length_in_s: 8.0
          denoise_enabled: true
          denoise_strength: 0.15
          denoise_noise_quantile: 0.2
          denoise_floor_ratio: 0.40
          denoise_hop_length: 512
          fade_ms: 80.0
          negative_prompt: >-
            hiss, static noise, background hum, tape noise, insects, low quality, distortion
          intensity_profiles:
            heavy:
              adapter: heavy
              prompt: >-
                loud roaring blustery wind through dry eucalyptus woodland, intense strong gusts,
                Bowra, Australia
              guidance_scale: 3.4
              output_target_rms: 0.09
              highpass_hz: 80.0
              denoise_strength: 0.15
              denoise_floor_ratio: 0.40
            medium:
              adapter: medium
              prompt: >-
                steady wind through dry eucalyptus woodland, gentle natural breeze,
                Bowra, Australia
              guidance_scale: 3.0
              output_target_rms: 0.048
              highpass_hz: 80.0
              denoise_strength: 0.19
              denoise_floor_ratio: 0.38
            light:
              derived_from: medium
              prompt: >-
                gentle light breeze through dry eucalyptus woodland, soft faint airflow,
                Bowra, Australia
              guidance_scale: 2.5
              output_target_rms: 0.045
              highpass_hz: 80.0
              lowpass_hz: 6000.0
              denoise_strength: 0.22
              denoise_floor_ratio: 0.30
        notes:
          - Sealed profiles (2026-06-04): light=light_a, medium=v3, heavy=v2.
          - medium/heavy are true adapters; light is parametric-derived from medium.
          - Runtime expects weather_type=wind and intensity in {light,medium,heavy}.

      murphy__mvp_1__weather_stem_selector:
        label: "Weather stem selector — site-only MVP"
        author: murphy
        stage: mvp_1
        status: mvp_candidate
        uses_seed: true
        checkpoint: null
        description: |
          Selects a short weather-only stem for a chosen weather type, intensity, and duration. Under the hood: a site-only retrieval pool from site_257 Bowra dry woodland is filtered by weather label and intensity, then retrieval_seed chooses a deterministic site asset and start offset.

          Pool contents: 113 site-derived WAV stems promoted from CLAP/env/manual weather screening (6 rain, 12 rain+wind, 93 wind, 2 thunder backup). Curated sound-library assets remain documented in the index but are marked unavailable on this branch and are excluded from the runtime pool. Runtime output: a short WAV weather stem, RMS-normalised by requested intensity, for Layer D to place and mix into the final soundscape.

          Supported site weather types in this branch: rain, wind, and rain+wind, with thunder available only as a cautious backup pool. Site storm/rain+thunder/rain+thunder+wind are not exposed until reliable site-derived storm candidates are promoted. Runtime controls: weather_type, intensity, duration_s, and retrieval_seed. This is an asset-selection MVP, not a trained weather generator and not a full soundscape renderer.
        params:
          asset_index: acoustic_ai/layers/layer_b/attempts/lucas__smoke_1__curated_assets/data/weather/asset_index.csv
          default_weather_type: rain
          default_intensity: medium
          default_duration_s: 10.0
          target_rms:
            light: 0.035
            medium: 0.050
            heavy: 0.070
          peak_ceiling: 0.95
        notes:
          - First frontend-facing Layer B MVP.
          - Layer B outputs a short weather stem; Layer D owns final placement and full soundscape mixing.
          - Runtime parameters are weather_type, intensity, duration_s, and retrieval_seed.

      lucas__smoke_1__curated_assets:
        label: "Curated wind/rain assets"
        author: lucas
        stage: smoke_1
        status: placeholder
        checkpoint: null
        params: {}
        notes:
          - Asset library + parameter mixing, no trained model.

  layer_c:
    label: "Layer C — Events"
    default: lucas__smoke_1__audiogen_boobook
    attempts:
      lucas__smoke_1__audiogen_boobook:
        label: "Boobook owl (AudioGen LoRA)"
        author: lucas
        stage: smoke_1
        status: smoke_test_1_success
        uses_seed: true
        checkpoint: model/candidates/lucas/layer-c-audiogen-boobook-smoke
        params:
          base_model: facebook/audiogen-medium
          sample_rate: 16000
        notes:
          - Per-species LoRA; 16 kHz native.

  layer_d:
    label: "Layer D — Mixer"
    default: lucas__smoke_1__layered_mix
    attempts:
      lucas__smoke_1__layered_mix:
        label: "Layered mix (placeholder)"
        author: lucas
        stage: smoke_1
        status: placeholder
        checkpoint: null
        params: {}
        notes:
          - Combines A+B+C outputs into final WAV + explanation JSON.

  layer_e:
    label: "Layer E — Analysis"
    default: lucas__mvp_2__clap_knn_probe_enlarged
    # Analysis runs three independent detector heads on the raw mixture
    # (pipeline_design.md § Analysis Mode): E-A ambient context, E-B weather,
    # E-C events. Each attempt declares which head it serves via `head:`
    # (ambient | weather | events). The Analysis dev page groups the per-head
    # model picker by this field — an attempt with no `head` is not offered in
    # any head. Heads with no real model (weather, events today) render empty.
    attempts:
      lucas__mvp_2__clap_knn_probe_enlarged:
        label: "Ambient context — CLAP k-NN + probe (enlarged pool)"
        author: lucas
        stage: mvp_2
        head: ambient
        status: candidate
        checkpoint: model/candidates/lucas/mvp_2__clap_knn_probe_enlarged
        params:
          k: 5
          tau: 0.1
          ood_conf_threshold: 0.25
        notes:
          - Candidate E-A ambient analysis model trained on ambient_pool_v2.
          - MLP season probe improves over k-NN season (0.553 vs 0.512) but misses the 0.60 bar.
          - Diel/hour/month heads pass the candidate bars.
          - Serves the E-A head of the Analysis dev page via POST /layers/layer_e/attempts/{id}/analyze (handler.analyze).

      lucas__mvp_1__clap_knn_probe:
        label: "Ambient context — CLAP k-NN + probe (v0 pool)"
        author: lucas
        stage: mvp_1
        head: ambient
        status: parked_negative
        checkpoint: model/candidates/lucas/mvp_1__clap_knn_probe
        params:
          k: 5
          tau: 0.1
          ood_conf_threshold: 0.25
        notes:
          - Parked baseline trained on the original 1,982-segment pool.
          - Probe did not beat the k-NN season baseline on v0 data.

      songke__smoke_2__known_species_clap_probe:
        label: "Known species events - CLAP probe"
        author: songke
        stage: smoke_2
        head: events
        status: candidate
        checkpoint: model/candidates/songke/mvp_1__layer_e_species_event_detector
        params:
          threshold: 0.55
          window_s: 5.0
          hop_s: 1.0
          merge_gap_s: 1.0
          min_event_windows: 7
        notes:
          - E-C known-species detector for ninox_boobook, laughing_kookaburra, rhipidura_leucophrys, psophodes_cristatus, cincloramphus_mathewsi, podargus_strigoides, red_capped_robin, anas_superciliosa, australian_raven, peaceful_dove, galah, crested_bellbird, and rainbow_bee_eater.
          - Uses frozen LAION-CLAP audio embeddings plus a local MLP probe trained from xeno-canto clips.
          - Local no-magpie 13-class CLAP probe test accuracy is 0.817 and macro-F1 is 0.811 on the 2842-clip manifest.
          - Enriches each detected species event with a conservative phenology block for report synthesis.
          - Emits an analysis_report block with observations, inferred_context, and disagreements for aggregator integration.
          - Serves the E-C events head via POST /layers/layer_e/attempts/{id}/analyze.

      murphy__mvp_1__weather_direct_detection:
        label: "Weather analysis — CLAP + PANNs + AST gate v1.1"
        author: murphy
        stage: mvp_1
        head: weather
        status: mvp
        checkpoint: null
        params:
          model_backend: clap
          audioset_backend: panns
          guard_backend: ast
        notes:
          - Frozen E-B weather analysis MVP v1 for uploaded-audio weather detection.
          - Reports continuous rain / wind / thunder summaries through observations.weather.
          - Conservative gate v1.1 keeps rain+wind and thunder ambiguous cases honest.
          - Serves the E-B head of the Analysis dev page via POST /layers/layer_e/attempts/{id}/analyze.

      lucas__smoke_1__detectors:
        label: "Weather + event detectors"
        author: lucas
        stage: smoke_1
        # No `head:` — weather_detector.py / event_detector.py are TODO stubs
        # (checkpoint: null), so this attempt is intentionally NOT offered in
        # the E-B/E-C pickers. Give it `head: weather` / `head: events` and
        # split into per-head attempts once real detectors land.
        status: partial
        checkpoint: null
        params: {}
        notes:
          - Placeholder for the E-B weather + E-C event detector heads; both are unimplemented stubs.
          - Not surfaced in the Analysis dev page until a real detector model exists (see head note above).
