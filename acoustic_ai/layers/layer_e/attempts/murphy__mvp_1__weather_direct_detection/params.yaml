analysis_version: e_b_weather_mvp_1
sample_rate: 22050
channels: 1
window_s: 5.0
hop_s: 2.5

elements:
  - rain
  - wind
  - thunder

thresholds:
  rain_present: 0.55
  wind_present: 0.55
  thunder_present: 0.60
  low_confidence_margin: 0.08
  clipping_ratio_warning: 0.001

fusion_weights:
  clap: 0.65
  audioset: 0.25
  feature_support: 0.10

prompts:
  rain:
    - rain
    - light rain
    - steady rain
    - heavy rain
    - rain on leaves
    - rainfall ambience
  wind:
    - wind
    - light wind
    - strong wind
    - wind in trees
    - gusty wind
  thunder:
    - thunder
    - distant thunder
    - thunder rumble
    - thunderstorm
  none:
    - quiet dry woodland ambience
    - quiet outdoor ambience
    - no weather sound
  contamination:
    bio:
      - birdsong
      - insects
      - cicadas
    human_machine:
      - human voice
      - machinery
      - microphone handling noise

