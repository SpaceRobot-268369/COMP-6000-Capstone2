seed: 42
training:
  epochs: 500
  lr: 0.003
  rain_lr: 0.003
  wind_lr: 0.05
  weight_decay: 0.0003
  rain_weight_decay: 0.0003
  wind_weight_decay: 0.0001
  model_type: mlp
  rain_model_type: mlp
  wind_model_type: linear
  balance_mode: weighted
  hidden_dim: 8
  dropout: 0.0
  val_frac: 0.25
  max_cases: 0
  site_only: true
feature_extraction:
  panns_device: auto
  panns_duration_s: 30.0
  include_panns_logits: true
  include_dsp_features: true
outputs:
  checkpoint: model/candidates/liting/mvp_3__balanced_weather_head/weather_head.pt
  metrics: model/candidates/liting/mvp_3__balanced_weather_head/metrics.json
