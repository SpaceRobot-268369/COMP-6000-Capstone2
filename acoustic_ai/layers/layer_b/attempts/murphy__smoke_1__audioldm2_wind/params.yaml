training:
  base_model: cvssp/audioldm2
  manifest: acoustic_ai/layers/layer_b/attempts/murphy__smoke_1__audioldm2_wind/data/wind_manifest.csv
  num_epochs: 8
  batch_size: 2
  learning_rate: 1.0e-4
  mixed_precision: "no"
  max_duration_s: 10.0
  input_sample_rate: 16000
  normalize_audio: false
  target_rms: 0.005
  seed: 42
  lora:
    r: 8
    alpha: 32
    dropout: 0.1
    target_modules: [to_q, to_k, to_v, to_out.0]

inference:
  prompt: >-
    steady wind through dry woodland trees, Bowra dry woodland, Australia,
    no music, no machinery, no birds, no insects
  guidance_scale: 2.0
  num_inference_steps: 100
  audio_length_in_s: 10.0
  output_target_rms: 0.02
  highpass_hz: 80.0
