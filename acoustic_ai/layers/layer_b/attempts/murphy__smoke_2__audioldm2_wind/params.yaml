training:
  base_model: cvssp/audioldm2
  manifest: acoustic_ai/layers/layer_b/attempts/murphy__smoke_2__audioldm2_wind/data/wind_manifest.csv
  num_epochs: 6
  batch_size: 4
  learning_rate: 1.0e-5
  lr_scheduler: constant
  lr_warmup_steps: 100
  mixed_precision: fp16
  max_duration_s: 10.0
  input_sample_rate: 16000
  normalize_audio: false
  target_rms: 0.005
  seed: 42
  lora:
    r: 8
    alpha: 32
    dropout: 0.1
    target_modules: [to_q, to_k, to_v, to_out.0]

inference:
  prompt: >-
    steady wind through dry eucalyptus woodland, gentle natural breeze,
    Bowra, Australia
  negative_prompt: >-
    hiss, static noise, background hum, tape noise, insects, low quality, distortion
  guidance_scale: 3.0
  num_inference_steps: 200
  audio_length_in_s: 8.0
  output_target_rms: 0.06
  highpass_hz: 80.0
  denoise_enabled: true
  denoise_strength: 0.15
  denoise_noise_quantile: 0.2
  denoise_floor_ratio: 0.40
  denoise_hop_length: 512
  fade_ms: 80.0
