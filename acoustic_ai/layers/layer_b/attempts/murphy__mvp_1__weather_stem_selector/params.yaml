  prefer_exact_weather: true
  prefer_primary_layer_d_use: true
  prefer_site_only_when_at_least: 3
  mixed_weather_fallback: true

validation:
  index_asset_count: 113
  required_materialized_paths:
    - model/candidates/murphy/mvp_1__weather_stem_selector/index.json
    - model/candidates/murphy/mvp_1__weather_stem_selector/media_asset_bank/
  smoke_weather_types: [rain, wind, rain+wind]
